name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate marketplace and plugin manifests
        run: |
          npx -y @anthropic-ai/claude-code@2.1.294 plugin validate .
          npx -y @anthropic-ai/claude-code@2.1.294 plugin validate plugins/bosmang --strict
      - name: Versions agree
        run: |
          plugin=$(jq -r .version plugins/bosmang/.claude-plugin/plugin.json)
          market=$(jq -r .metadata.version .claude-plugin/marketplace.json)
          test "$plugin" = "$market" || { echo "plugin.json $plugin != marketplace.json $market"; exit 1; }
          grep -q "^## $plugin " CHANGELOG.md || { echo "CHANGELOG.md has no entry for $plugin"; exit 1; }
